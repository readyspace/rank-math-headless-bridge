name: Contract checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4']
    container: php:${{ matrix.php }}-cli
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check DOM extension
        run: php -r 'if (!class_exists("DOMDocument")) { fwrite(STDERR, "DOM is required\n"); exit(1); }'
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: URL mapping and safeguards
        run: php tests/run.php
      - name: Metadata and IndexNow
        run: php tests/metadata-test.php
  frontend-example:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:next
        env:
          NEXT_TELEMETRY_DISABLED: '1'
  wordpress-integration:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        wordpress: ['6.7', 'latest']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      - run: python3 scripts/package.py
      - run: npm run test:wordpress
        env:
          BRIDGE_TEST_WP: ${{ matrix.wordpress }}
          BRIDGE_TEST_PHP: '8.3'
          BRIDGE_TEST_PACKAGE: dist/rank-math-headless-bridge-0.2.0-alpha.1.zip
