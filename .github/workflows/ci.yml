name: Contract checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4']
    container: php:${{ matrix.php }}-cli
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check DOM extension
        run: php -r 'if (!class_exists("DOMDocument")) { fwrite(STDERR, "DOM is required\n"); exit(1); }'
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: URL mapping and safeguards
        run: php tests/run.php
      - name: Metadata and IndexNow
        run: php tests/metadata-test.php
  frontend-example:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:next
        env:
          NEXT_TELEMETRY_DISABLED: '1'
  wordpress-integration:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        wordpress: ['6.7', 'latest']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      - run: python3 scripts/package.py
      - run: npm run test:wordpress
        env:
          BRIDGE_TEST_WP: ${{ matrix.wordpress }}
          BRIDGE_TEST_PHP: '8.3'
          BRIDGE_TEST_PACKAGE: dist/readyspace-headless-seo-bridge-for-rank-math-0.2.1.zip
  wordpress-directory-check:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: bridge-test-only
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=bridge-test-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, dom
          tools: wp-cli
          coverage: none
      - name: Build submission ZIP
        run: python3 scripts/package.py
      - name: Install disposable WordPress and official Plugin Check
        run: |
          wp core download --path=/tmp/bridge-directory-site
          wp config create --path=/tmp/bridge-directory-site --dbname=wordpress --dbuser=root --dbpass=bridge-test-only --dbhost=127.0.0.1
          wp core install --path=/tmp/bridge-directory-site --url=http://127.0.0.1:8090 --title="Bridge directory test" --admin_user=reviewer --admin_password=bridge-test-only --admin_email=reviewer@example.test --skip-email
          wp plugin install "$GITHUB_WORKSPACE/dist/readyspace-headless-seo-bridge-for-rank-math-0.2.1.zip" --activate --path=/tmp/bridge-directory-site
          wp plugin install plugin-check --activate --path=/tmp/bridge-directory-site
      - name: Check actual packaged plugin for WordPress.org
        run: wp plugin check readyspace-headless-seo-bridge-for-rank-math --slug=readyspace-headless-seo-bridge-for-rank-math --format=json --path=/tmp/bridge-directory-site
