name: Contract checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4']
    container: php:${{ matrix.php }}-cli
    steps:
      - uses: actions/checkout@v4
      - name: Check DOM extension
        run: php -r 'if (!class_exists("DOMDocument")) { fwrite(STDERR, "DOM is required\n"); exit(1); }'
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: URL mapping and safeguards
        run: php tests/run.php
      - name: Metadata and IndexNow
        run: php tests/metadata-test.php
  frontend-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test tests/frontend-example.test.mjs
